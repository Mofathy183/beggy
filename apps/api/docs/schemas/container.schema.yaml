components:
  schemas:
    PackItemRequest:
      type: object
      additionalProperties: false
      required:
        - itemId
        - quantity
      properties:
        itemId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    UnpackItemRequest:
      type: object
      additionalProperties: false
      required:
        - itemId
        - quantity
      properties:
        itemId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    MoveItemRequest:
      type: object
      additionalProperties: false
      required:
        - fromContainerId
        - toContainerId
        - itemId
        - quantity
      properties:
        fromContainerId:
          type: string
          format: uuid
        toContainerId:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    ContainerMetrics:
      type: object
      properties:
        currentWeight:
          type: number
        currentCapacity:
          type: number
        remainingWeight:
          type: number
        remainingCapacity:
          type: number
        weightPercentage:
          type: number
        capacityPercentage:
          type: number
        itemCount:
          type: integer

    ContainerState:
      type: object
      properties:
        isOverweight:
          type: boolean
        isOverCapacity:
          type: boolean
        isFull:
          type: boolean
        status:
          $ref: "#/components/schemas/ContainerStatus"
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/ContainerStatusReason"

    ContainerStatusDTO:
      type: object
      properties:
        metrics:
          $ref: "#/components/schemas/ContainerMetrics"
        state:
          $ref: "#/components/schemas/ContainerState"

    ContainerSummaryDTO:
      type: object
      properties:
        containerId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ContainerStatusDTO"

    MoveResultDTO:
      type: object
      properties:
        from:
          $ref: "#/components/schemas/ContainerSummaryDTO"
        to:
          $ref: "#/components/schemas/ContainerSummaryDTO"

    TypedContainerDTO:
      oneOf:
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/ContainerType"
            data:
              $ref: "#/components/schemas/BagDTO"
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/ContainerType"
            data:
              $ref: "#/components/schemas/SuitcaseDTO"
      discriminator:
        propertyName: type
